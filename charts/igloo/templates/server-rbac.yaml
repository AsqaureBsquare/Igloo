{{- if .Values.server.serviceAccount.create }}
# Lets the server read workspace pod logs for the "Agent log" tab.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "igloo.server.fullname" . }}-pod-logs
  namespace: {{ .Values.provisioner.workspace.namespace | default "workspaces" }}
  labels:
    {{- include "igloo.server.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "igloo.server.fullname" . }}-pod-logs
  namespace: {{ .Values.provisioner.workspace.namespace | default "workspaces" }}
  labels:
    {{- include "igloo.server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "igloo.server.fullname" . }}-pod-logs
subjects:
- kind: ServiceAccount
  name: {{ include "igloo.server.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
