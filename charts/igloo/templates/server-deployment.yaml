apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "igloo.server.fullname" . }}
  labels:
    {{- include "igloo.server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "igloo.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "igloo.server.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      {{- include "igloo.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "igloo.server.serviceAccountName" . }}
      {{- if include "igloo.postgres.bundled" . }}
      initContainers:
        - name: wait-for-postgres
          image: {{ include "igloo.image" (dict "root" . "image" .Values.postgresql.image) | quote }}
          command: ["sh", "-c", "until pg_isready -h {{ include "igloo.postgres.fullname" . }} -U igloo -d igloo; do sleep 2; done"]
      {{- end }}
      containers:
        - name: server
          image: {{ include "igloo.image" (dict "root" . "image" (printf "%s:%v" .Values.server.image.repository .Values.server.image.tag)) | quote }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          command: ["./igloo"]
          args:
            - server
            {{- if .Values.server.localMode }}
            - --local
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.server.port | quote }}
            - name: AWS_REGION
              value: {{ .Values.server.aws.region | quote }}
            - name: IGLOO_SERVER_URL
              value: {{ .Values.server.serverURL | quote }}
            - name: IGLOO_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: IGLOO_DAEMON_MODE
              value: "true"
            - name: IGLOO_PROVISIONER_BOOTSTRAP_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.fullname" . }}-secrets
                  key: IGLOO_PROVISIONER_KEY
            - name: IGLOO_TF_STATE_BUCKET
              value: {{ .Values.provisioner.workspace.tfStateBucket | quote }}
            - name: IGLOO_TF_STATE_REGION
              value: {{ .Values.provisioner.aws.region | quote }}
            - name: IGLOO_WORKSPACE_IMAGE
              value: {{ if .Values.provisioner.workspace.image }}{{ include "igloo.image" (dict "root" . "image" .Values.provisioner.workspace.image) | quote }}{{ else }}""{{ end }}
            - name: IGLOO_WORKSPACE_NAMESPACE
              value: {{ .Values.provisioner.workspace.namespace | default "workspaces" | quote }}
            {{- if .Values.server.devUI.hostPath }}
            - name: IGLOO_UI_DIR
              value: /ui
            {{- end }}
            {{- if .Values.server.sandboxImage }}
            - name: IGLOO_SANDBOX_IMAGE
              value: {{ include "igloo.image" (dict "root" . "image" .Values.server.sandboxImage) | quote }}
            {{- end }}
            {{- if .Values.guard.enabled }}
            - name: IGLOO_GUARD_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.guard.fullname" . }}
                  key: key
            - name: IGLOO_GUARD_PROXY_URL
              value: {{ include "igloo.guard.proxyURL" . | quote }}
            {{- end }}
            {{- if .Values.server.allowSignup }}
            - name: IGLOO_ALLOW_SIGNUP
              value: "true"
            {{- end }}
            {{- if .Values.server.corsOrigins }}
            - name: IGLOO_CORS_ORIGINS
              value: {{ .Values.server.corsOrigins | quote }}
            {{- end }}
            - name: IGLOO_SEED_TEMPLATES
              value: "true"
            - name: IGLOO_DYNAMO_TABLE
              value: {{ .Values.server.dynamo.table | quote }}
            {{- if include "igloo.postgres.bundled" . }}
            - name: IGLOO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.postgres.fullname" . }}
                  key: url
            {{- else if .Values.server.database.postgresURL }}
            - name: IGLOO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.fullname" . }}-secrets
                  key: IGLOO_DATABASE_URL
            {{- else if .Values.server.database.mongoURL }}
            - name: IGLOO_MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.fullname" . }}-secrets
                  key: IGLOO_MONGO_URL
            {{- end }}
            {{- if .Values.server.oidc.enabled }}
            - name: IGLOO_OIDC_ISSUER_URL
              value: {{ .Values.server.oidc.issuerURL | quote }}
            - name: IGLOO_OIDC_CLIENT_ID
              value: {{ .Values.server.oidc.clientID | quote }}
            - name: IGLOO_OIDC_REDIRECT_URL
              value: {{ .Values.server.oidc.redirectURL | quote }}
            - name: IGLOO_OIDC_SCOPES
              value: {{ .Values.server.oidc.scopes | quote }}
            {{- if .Values.server.oidc.buttonText }}
            - name: IGLOO_OIDC_BUTTON_TEXT
              value: {{ .Values.server.oidc.buttonText | quote }}
            {{- end }}
            {{- if .Values.server.oidc.iconURL }}
            - name: IGLOO_OIDC_ICON_URL
              value: {{ .Values.server.oidc.iconURL | quote }}
            {{- end }}
            {{- if .Values.server.oidc.clientSecret }}
            - name: IGLOO_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "igloo.fullname" . }}-secrets
                  key: IGLOO_OIDC_CLIENT_SECRET
            {{- end }}
            - name: IGLOO_DISABLE_PASSWORD_AUTH
              value: {{ .Values.server.oidc.disablePasswordAuth | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- if .Values.server.devUI.hostPath }}
          volumeMounts:
            - name: dev-ui
              mountPath: /ui
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      {{- if .Values.server.devUI.hostPath }}
      volumes:
        - name: dev-ui
          hostPath:
            path: {{ .Values.server.devUI.hostPath | quote }}
            type: Directory
      {{- end }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
