# EKS deployment values — use with:
#   helm upgrade --install igloo charts/igloo -f charts/igloo/eks-values.yaml \
#     --set server.jwtSecret=<secret> \
#     --set provisioner.key=<key> \
#     --set server.serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=<irsa-arn>

server:
  image:
    repository: ghcr.io/asqaurebsquare/igloo-server
    tag: main
    pullPolicy: Always

  replicas: 1
  localMode: false
  serverURL: "https://igloos.cloud"

  aws:
    region: us-east-1

  # DynamoDB table names (match infra/ecs terraform outputs)
  dynamo:
    usersTable:      igloo-users
    workspacesTable: igloo-workspaces
    templatesTable:  igloo-templates
    jobsTable:       igloo-ws-jobs

  # IRSA — set via --set at deploy time (output from terraform)
  serviceAccount:
    create: true
    annotations: {}
      # eks.amazonaws.com/role-arn: <server_irsa_role_arn from terraform output>

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: alb
    annotations:
      kubernetes.io/ingress.class: alb
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/subnets: subnet-069d191e5e1ebede4,subnet-0a068c82d78e387af
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:601804669600:certificate/2feafdf8-f49a-44a0-b8a8-da2cecf35a14
      alb.ingress.kubernetes.io/idle-timeout: "3600"
      alb.ingress.kubernetes.io/healthcheck-path: /health
    host: ""
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

provisioner:
  image:
    repository: ghcr.io/asqaurebsquare/igloo-provisioner
    tag: main
    pullPolicy: Always

  replicas: 1
  concurrency: 5

  aws:
    region: us-east-1

  workspace:
    image: 601804669600.dkr.ecr.us-east-1.amazonaws.com/igloo-workspace:latest
    tfStateBucket: igloo-ws-state-601804669600

  serviceAccount:
    create: true
    annotations: {}
      # eks.amazonaws.com/role-arn: <provisioner_irsa_role_arn>

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
