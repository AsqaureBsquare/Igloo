# A stand-in for an internal service, used by the guard end-to-end test: it answers 200 only
# when the request carries the expected API key, and 401 otherwise, so a 200 proves the
# gateway added the credential. Apply with: kubectl apply -f e2e/testdata/upstream.yaml
apiVersion: v1
kind: ConfigMap
metadata: {name: internal-api-conf, namespace: default}
data:
  default.conf: |
    server {
      listen 8080;
      location / {
        if ($http_x_api_key != "real-upstream-secret-9f3a") { return 401 "missing or wrong key\n"; }
        return 200 "authorized\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: internal-api, namespace: default}
spec:
  replicas: 1
  selector: {matchLabels: {app: internal-api}}
  template:
    metadata: {labels: {app: internal-api}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 8080}]
        volumeMounts: [{name: conf, mountPath: /etc/nginx/conf.d}]
      volumes: [{name: conf, configMap: {name: internal-api-conf}}]
---
apiVersion: v1
kind: Service
metadata: {name: internal-api, namespace: default}
spec:
  selector: {app: internal-api}
  ports: [{port: 8080, targetPort: 8080}]
