<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Map — Igloo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #020c18; overflow: hidden; font-family: 'JetBrains Mono', monospace; color: #c8e8ff; }

    .nm-chrome { display: flex; flex-direction: column; height: 100vh; }

    .nm-titlebar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; height: 40px;
      background: #030f1f; border-bottom: 1px solid rgba(99,210,255,0.1);
      flex-shrink: 0;
    }
    .nm-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: #c8e8ff; }
    .nm-subtitle { font-size: 11px; color: #4a7a9b; margin-left: 4px; font-weight: 400; }
    .nm-controls { display: flex; gap: 8px; align-items: center; }
    .nm-badge { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: rgba(0,212,255,0.1); color: #00d4ff; border: 1px solid rgba(0,212,255,0.2); }
    .nm-refresh { font-size: 11px; color: #4a7a9b; cursor: pointer; padding: 4px 8px; border-radius: 4px; border: 1px solid rgba(99,210,255,0.15); background: none; color: #4a7a9b; }
    .nm-refresh:hover { color: #c8e8ff; border-color: rgba(99,210,255,0.3); }

    .nm-body { flex: 1; min-height: 0; position: relative; }
    svg { width: 100%; height: 100%; }

    .nm-legend {
      position: absolute; bottom: 12px; left: 12px;
      background: rgba(3,15,31,0.85); border: 1px solid rgba(99,210,255,0.1);
      border-radius: 8px; padding: 10px 14px; font-size: 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .nm-legend-item { display: flex; align-items: center; gap: 6px; color: #4a7a9b; }
    .nm-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    .nm-tooltip {
      position: absolute; display: none; pointer-events: none;
      background: rgba(3,15,31,0.95); border: 1px solid rgba(99,210,255,0.2);
      border-radius: 6px; padding: 8px 12px; font-size: 11px;
      max-width: 260px; line-height: 1.5;
    }
    .nm-tooltip strong { color: #00d4ff; display: block; margin-bottom: 2px; }

    .nm-empty {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      text-align: center; color: #4a7a9b; font-size: 13px;
    }
    .nm-empty .nm-spinner {
      width: 32px; height: 32px; border: 2px solid rgba(99,210,255,0.15);
      border-top-color: #00d4ff; border-radius: 50%; margin: 0 auto 12px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="nm-chrome">
  <div class="nm-titlebar">
    <div class="nm-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9" stroke-opacity=".4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>
      Network Map
      <span class="nm-subtitle" id="nm-name">—</span>
    </div>
    <div class="nm-controls">
      <span class="nm-badge" id="nm-count">0 connections</span>
      <button class="nm-refresh" onclick="load()">↻ Refresh</button>
    </div>
  </div>
  <div class="nm-body" id="nm-body">
    <div class="nm-empty" id="nm-empty">
      <div class="nm-spinner"></div>
      Loading network data…
    </div>
    <div class="nm-legend" id="nm-legend" style="display:none">
      <div class="nm-legend-item"><div class="nm-legend-dot" style="background:#00d4ff"></div>Workspace</div>
      <div class="nm-legend-item"><div class="nm-legend-dot" style="background:#00ffb3"></div>Listening port</div>
      <div class="nm-legend-item"><div class="nm-legend-dot" style="background:#9d5cff"></div>Internal / K8s</div>
      <div class="nm-legend-item"><div class="nm-legend-dot" style="background:#ffc400"></div>External</div>
      <div class="nm-legend-item"><div class="nm-legend-dot" style="background:#4a7a9b"></div>Loopback</div>
    </div>
    <div class="nm-tooltip" id="nm-tooltip"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const params  = new URLSearchParams(window.location.search);
const wsId    = params.get('wsId');
const wsName  = params.get('name') || 'workspace';
const token   = localStorage.getItem('igloo_token');

document.title = `${wsName} — Network Map`;
document.getElementById('nm-name').textContent = wsName;

// ─── Port → service name ────────────────────────────────────────────────────
const portNames = {
  22:'SSH', 53:'DNS', 80:'HTTP', 443:'HTTPS', 2379:'etcd',
  2380:'etcd-peer', 3306:'MySQL', 5432:'PostgreSQL', 6379:'Redis',
  8080:'HTTP-alt', 8443:'HTTPS-alt', 10250:'kubelet', 10255:'kubelet-ro',
  27017:'MongoDB', 4369:'EPMD', 5672:'AMQP', 9092:'Kafka',
  9200:'Elasticsearch', 9300:'Elasticsearch-cluster', 6443:'K8s-API',
};

function portLabel(p) { return portNames[+p] ? `${p} (${portNames[+p]})` : p; }

function nodeType(ip) {
  if (ip === '0.0.0.0' || ip === '::' || ip === '127.0.0.1' || ip.startsWith('::1')) return 'loopback';
  if (ip.startsWith('10.') || ip.startsWith('172.16.') || ip.startsWith('172.17.') ||
      ip.startsWith('192.168.') || ip.startsWith('fd') || ip.startsWith('fe80')) return 'internal';
  return 'external';
}

function nodeColor(type) {
  return { workspace:'#00d4ff', listener:'#00ffb3', internal:'#9d5cff', external:'#ffc400', loopback:'#4a7a9b' }[type] || '#4a7a9b';
}

// ─── Build graph from connections ───────────────────────────────────────────
function buildGraph(connections) {
  const nodes = new Map();
  const links = [];

  nodes.set('__ws__', { id:'__ws__', label: wsName, type:'workspace', conns:[] });

  for (const c of connections) {
    if (c.state === 'LISTEN') {
      const id = `listen:${c.local_port}`;
      if (!nodes.has(id)) {
        nodes.set(id, { id, label: `:${c.local_port}`, sublabel: portLabel(c.local_port), type:'listener', conns:[] });
      }
      if (!links.find(l => l.source === '__ws__' && l.target === id)) {
        links.push({ source:'__ws__', target:id, type:'listen' });
      }
      continue;
    }

    const rip = c.remote_addr;
    if (!rip || rip === '0.0.0.0' || rip === '::') continue;

    const ntype = nodeType(rip);
    const id = rip;
    if (!nodes.has(id)) {
      const svc = portNames[+c.remote_port] || portNames[+c.local_port];
      nodes.set(id, {
        id, label: rip,
        sublabel: svc ? `→ ${svc}` : `→ :${c.remote_port}`,
        type: ntype, conns: [],
      });
    }
    nodes.get(id).conns.push(c);

    const direction = +c.remote_port < 1024 || portNames[+c.remote_port] ? 'outbound' : 'inbound';
    const src = direction === 'outbound' ? '__ws__' : id;
    const tgt = direction === 'outbound' ? id : '__ws__';
    if (!links.find(l => l.source === src && l.target === tgt && l.remote === rip)) {
      links.push({ source: src, target: tgt, type: direction, remote: rip, state: c.state });
    }
  }

  return { nodes: [...nodes.values()], links };
}

// ─── D3 render ──────────────────────────────────────────────────────────────
let simulation;

function render(connections) {
  const body = document.getElementById('nm-body');
  document.getElementById('nm-empty').style.display = 'none';
  document.getElementById('nm-legend').style.display = '';
  document.getElementById('nm-count').textContent = `${connections.length} connections`;

  body.querySelectorAll('svg').forEach(s => s.remove());

  const { nodes, links } = buildGraph(connections);

  const W = body.clientWidth, H = body.clientHeight;
  const svg = d3.select('#nm-body').append('svg')
    .attr('width', W).attr('height', H);

  // Arrow markers
  const defs = svg.append('defs');
  ['outbound','inbound','listen'].forEach(t => {
    const color = t === 'outbound' ? '#ffc400' : t === 'inbound' ? '#ff6b8a' : '#00ffb3';
    defs.append('marker').attr('id', `arrow-${t}`)
      .attr('viewBox','0 -4 8 8').attr('refX',16).attr('refY',0)
      .attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
      .append('path').attr('d','M0,-4L8,0L0,4').attr('fill', color);
  });

  const g = svg.append('g');

  // Zoom
  svg.call(d3.zoom().scaleExtent([0.3, 3]).on('zoom', e => g.attr('transform', e.transform)));

  if (simulation) simulation.stop();
  simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.type === 'listen' ? 90 : 150).strength(0.6))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(36));

  const link = g.append('g').selectAll('line').data(links).join('line')
    .attr('stroke', d => d.type === 'listen' ? '#00ffb3' : d.type === 'outbound' ? '#ffc400' : '#ff6b8a')
    .attr('stroke-width', 1.5)
    .attr('stroke-dasharray', d => d.type === 'listen' ? '4,3' : null)
    .attr('stroke-opacity', 0.6)
    .attr('marker-end', d => `url(#arrow-${d.type})`);

  const node = g.append('g').selectAll('g').data(nodes).join('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag',  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end',   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle')
    .attr('r', d => d.type === 'workspace' ? 28 : d.type === 'listener' ? 16 : 20)
    .attr('fill', d => nodeColor(d.type) + '22')
    .attr('stroke', d => nodeColor(d.type))
    .attr('stroke-width', d => d.type === 'workspace' ? 2.5 : 1.5);

  // Workspace icon
  node.filter(d => d.type === 'workspace').append('text')
    .attr('text-anchor','middle').attr('dy','0.35em')
    .attr('font-size', 18).attr('fill','#00d4ff').text('❄');

  // Listener icon
  node.filter(d => d.type === 'listener').append('text')
    .attr('text-anchor','middle').attr('dy','0.35em')
    .attr('font-size', 10).attr('fill','#00ffb3').text('⬡');

  // Remote icon
  node.filter(d => d.type !== 'workspace' && d.type !== 'listener').append('text')
    .attr('text-anchor','middle').attr('dy','0.35em')
    .attr('font-size', 11)
    .attr('fill', d => nodeColor(d.type))
    .text(d => d.type === 'external' ? '◉' : d.type === 'loopback' ? '⊙' : '◎');

  // Labels
  node.append('text')
    .attr('text-anchor','middle').attr('dy', d => (d.type === 'workspace' ? 28 : d.type === 'listener' ? 16 : 20) + 14)
    .attr('font-size', 9).attr('fill','#4a7a9b').attr('font-family','monospace')
    .text(d => d.label.length > 20 ? d.label.slice(0,18)+'…' : d.label);

  node.append('text')
    .attr('text-anchor','middle').attr('dy', d => (d.type === 'workspace' ? 28 : d.type === 'listener' ? 16 : 20) + 24)
    .attr('font-size', 8).attr('fill','#2a4a6b').attr('font-family','monospace')
    .text(d => d.sublabel || '');

  // Tooltip
  const tooltip = document.getElementById('nm-tooltip');
  node.on('mousemove', (e, d) => {
    let html = `<strong>${d.label}</strong>`;
    if (d.type === 'listener') html += `Listening on port ${d.label.slice(1)}<br>${portLabel(d.label.slice(1))}`;
    else if (d.conns && d.conns.length) {
      html += d.conns.map(c => `${c.state} → :${c.remote_port}`).join('<br>');
    } else if (d.type === 'workspace') {
      html += 'This workspace pod';
    }
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    tooltip.style.left = (e.offsetX + 12) + 'px';
    tooltip.style.top  = (e.offsetY + 12) + 'px';
  }).on('mouseleave', () => { tooltip.style.display = 'none'; });

  simulation.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

// ─── Load data ──────────────────────────────────────────────────────────────
function load() {
  if (!wsId || !token) {
    document.getElementById('nm-empty').innerHTML = '<div style="color:#ff3d6b">Missing workspace ID or auth token.</div>';
    return;
  }
  fetch(`/api/workspaces/${wsId}/network`, {
    headers: { Authorization: 'Bearer ' + token }
  })
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(data => {
    if (!data.connections || data.connections.length === 0) {
      document.getElementById('nm-empty').style.display = '';
      document.getElementById('nm-empty').innerHTML = '<div style="color:#4a7a9b;font-size:13px">No connections yet.<br><small>Agent sends a snapshot every 30s.</small></div>';
      document.getElementById('nm-legend').style.display = 'none';
      document.getElementById('nm-count').textContent = '0 connections';
      return;
    }
    render(data.connections);
  })
  .catch(e => {
    document.getElementById('nm-empty').style.display = '';
    document.getElementById('nm-empty').innerHTML = `<div style="color:#ff3d6b">Failed to load: ${e}</div>`;
  });
}

load();
// Auto-refresh every 30s to stay in sync with agent poll
setInterval(load, 30000);
</script>
</body>
</html>
