name: Publish Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: igloo-server
            dockerfile: Dockerfile
          - name: igloo-provisioner
            dockerfile: Dockerfile.provisioner
          - name: igloo-workspace
            dockerfile: Dockerfile.workspace
          - name: igloo-guard
            dockerfile: Dockerfile.guard

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Rollout to EKS
    needs: build-push
    # Opt in with the repository variable DEPLOY_TO_EKS=true (Settings > Secrets and variables > Actions >
    # Variables), once the cluster and the AWS_ROLE_ARN secret exist. Without it, publishing images
    # does not try to reach AWS.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_TO_EKS == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name igloo-eks

      - name: Restart server & provisioner
        run: |
          kubectl rollout restart deployment/igloo-server deployment/igloo-provisioner -n default
          kubectl rollout status deployment/igloo-server deployment/igloo-provisioner -n default --timeout=5m
