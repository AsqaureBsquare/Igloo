name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/asqaurebsquare/igloo-server:main
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build & push provisioner
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.provisioner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/asqaurebsquare/igloo-provisioner:main
          cache-from: type=gha,scope=provisioner
          cache-to: type=gha,mode=max,scope=provisioner

      - name: Build & push workspace agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/amd64
          push: true
          tags: ghcr.io/asqaurebsquare/igloo-workspace:main
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace

  deploy:
    name: Rollout to EKS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name igloo-eks

      - name: Restart server & provisioner
        run: |
          kubectl rollout restart deployment/igloo-server deployment/igloo-provisioner -n default
          kubectl rollout status deployment/igloo-server deployment/igloo-provisioner -n default --timeout=5m
