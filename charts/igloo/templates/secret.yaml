apiVersion: v1
kind: Secret
metadata:
  name: {{ include "igloo.fullname" . }}-secrets
  labels:
    {{- include "igloo.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "server.jwtSecret is required" .Values.server.jwtSecret | quote }}
  IGLOO_PROVISIONER_KEY: {{ required "provisioner.key is required" .Values.provisioner.key | quote }}
  {{- if .Values.server.database.postgresURL }}
  IGLOO_DATABASE_URL: {{ .Values.server.database.postgresURL | quote }}
  {{- end }}
  {{- if .Values.server.database.mongoURL }}
  IGLOO_MONGO_URL: {{ .Values.server.database.mongoURL | quote }}
  {{- end }}
  {{- if and .Values.server.oidc.enabled .Values.server.oidc.clientSecret }}
  IGLOO_OIDC_CLIENT_SECRET: {{ .Values.server.oidc.clientSecret | quote }}
  {{- end }}
