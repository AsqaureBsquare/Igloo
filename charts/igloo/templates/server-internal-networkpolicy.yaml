{{- if gt (int .Values.server.replicas) 1 }}
# The internal relay port (8081) carries raw replica-to-replica streams, authenticated
# by a key derived from the JWT secret. Defence in depth: only server pods may reach it.
# The HTTP port stays open to everything, as before this policy existed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "igloo.server.fullname" . }}-internal
  labels:
    {{- include "igloo.server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "igloo.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.server.port }}
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              {{- include "igloo.server.selectorLabels" . | nindent 14 }}
      ports:
        - port: 8081
          protocol: TCP
{{- end }}
