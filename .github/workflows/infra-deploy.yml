name: Deploy Infrastructure + App

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for GitHub OIDC → AWS auth
  contents: read
  packages: read    # required to pull GHCR images during helm verify

jobs:
  infra:
    name: Terraform Apply
    runs-on: ubuntu-latest
    outputs:
      cluster_name:         ${{ steps.tf.outputs.cluster_name }}
      server_irsa_arn:      ${{ steps.tf.outputs.server_irsa_arn }}
      provisioner_irsa_arn: ${{ steps.tf.outputs.provisioner_irsa_arn }}
      ebs_csi_arn:          ${{ steps.tf.outputs.ebs_csi_arn }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init + reconcile access entries
        working-directory: infra/aws
        run: |
          terraform init
          # Remove stale access entries from state (avoids drift errors)
          terraform state rm 'module.eks.aws_eks_access_entry.this["cluster_creator"]' 2>/dev/null || true
          terraform state rm 'module.eks.aws_eks_access_entry.this["github_actions"]' 2>/dev/null || true
          # Delete from AWS so Terraform owns it cleanly (uses only EKS API, not K8s API)
          aws eks delete-access-entry \
            --cluster-name igloo-eks \
            --principal-arn arn:aws:iam::601804669600:role/igloo-github-actions 2>/dev/null || true

      - name: Terraform apply stage 1 — restore K8s access entry
        working-directory: infra/aws
        run: |
          # Create access entry first (EKS/AWS API only — no K8s auth needed yet)
          terraform apply -auto-approve \
            -target='module.eks.aws_eks_access_entry.this["github_actions"]' \
            -target='module.eks.aws_eks_access_policy_association.this["github_actions_admin"]'

      - name: Terraform apply stage 2 — full apply
        id: tf
        working-directory: infra/aws
        run: |
          terraform apply -auto-approve
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "server_irsa_arn=$(terraform output -raw server_irsa_role_arn)" >> $GITHUB_OUTPUT
          echo "provisioner_irsa_arn=$(terraform output -raw provisioner_irsa_role_arn)" >> $GITHUB_OUTPUT
          echo "ebs_csi_arn=$(terraform output -raw ebs_csi_role_arn)" >> $GITHUB_OUTPUT

  deploy:
    name: Helm Deploy
    needs: infra
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name ${{ needs.infra.outputs.cluster_name }}

      - name: Install / upgrade EBS CSI addon
        run: |
          aws eks create-addon \
            --cluster-name ${{ needs.infra.outputs.cluster_name }} \
            --addon-name aws-ebs-csi-driver \
            --service-account-role-arn ${{ needs.infra.outputs.ebs_csi_arn }} \
            --resolve-conflicts OVERWRITE 2>/dev/null || \
          aws eks update-addon \
            --cluster-name ${{ needs.infra.outputs.cluster_name }} \
            --addon-name aws-ebs-csi-driver \
            --service-account-role-arn ${{ needs.infra.outputs.ebs_csi_arn }} \
            --resolve-conflicts OVERWRITE

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Adopt pre-existing namespaces into Helm
        run: |
          for ns in default workspaces; do
            kubectl get namespace "$ns" 2>/dev/null && \
              kubectl annotate namespace "$ns" \
                meta.helm.sh/release-name=igloo \
                meta.helm.sh/release-namespace=default \
                --overwrite && \
              kubectl label namespace "$ns" \
                app.kubernetes.io/managed-by=Helm \
                --overwrite || true
          done

      - name: Helm upgrade
        run: |
          helm upgrade --install igloo charts/igloo \
            -f charts/igloo/eks-values.yaml \
            --set server.jwtSecret=${{ secrets.IGLOO_JWT_SECRET }} \
            --set provisioner.key=${{ secrets.IGLOO_PROVISIONER_KEY }} \
            --set "server.serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${{ needs.infra.outputs.server_irsa_arn }}" \
            --set "provisioner.serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${{ needs.infra.outputs.provisioner_irsa_arn }}" \
            --wait --timeout 10m

      - name: Update igloos.cloud DNS to new ALB
        run: |
          ALB=$(kubectl get ingress igloo-server -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "ALB address: $ALB"

          # us-east-1 ALB canonical hosted zone ID is a fixed AWS constant
          ALB_ZONE="Z35SXDOTRQ7X7K"
          echo "ALB hosted zone: $ALB_ZONE"

          aws route53 change-resource-record-sets \
            --hosted-zone-id Z05774773F59CRJ02AR4D \
            --change-batch "{
              \"Changes\": [{
                \"Action\": \"UPSERT\",
                \"ResourceRecordSet\": {
                  \"Name\": \"igloos.cloud\",
                  \"Type\": \"A\",
                  \"AliasTarget\": {
                    \"HostedZoneId\": \"${ALB_ZONE}\",
                    \"DNSName\": \"${ALB}\",
                    \"EvaluateTargetHealth\": true
                  }
                }
              }]
            }"
          echo "DNS updated: igloos.cloud -> ${ALB}"
